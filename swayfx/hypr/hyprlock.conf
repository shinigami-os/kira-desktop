# hyprlock only needs the ext-session-lock-v1 protocol, so it locks fine under SwayFX.

general {
    grace = 0
    hide_cursor = false
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    color = rgb(5, 3, 10)
    blur_passes = 0
}

label { # clock
    monitor =
    text = $TIME
    color = rgb(232, 216, 255)
    font_family = Raleway
    font_size = 72
    position = 0, 70
    halign = center
    valign = center
}

label { # date
    monitor =
    text = cmd[update:60000] date +"%a %d %b"
    color = rgb(107, 79, 158)
    font_family = Raleway
    font_size = 11
    position = 0, 20
    halign = center
    valign = center
}

label { # chevron prompt, sits just left of the input field
    monitor =
    text = ❯
    color = rgb(170, 0, 255)
    font_family = JetBrains Mono
    font_size = 12
    position = -120, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 220, 24
    rounding = 3
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(36, 26, 56)
    inner_color = rgb(18, 12, 30)
    font_color = rgb(232, 216, 255)
    fade_on_empty = false
    placeholder_text =
    check_color = rgb(170, 0, 255)
    fail_color = rgb(255, 0, 170)
    fail_text = wrong password
    fail_timeout = 1500

    position = 20, -60
    halign = center
    valign = center
}

label { # hint
    monitor =
    text = it still trusts you. prove it.
    color = rgb(86, 67, 110)
    font_family = JetBrains Mono
    font_size = 9
    position = 0, -95
    halign = center
    valign = center
}
