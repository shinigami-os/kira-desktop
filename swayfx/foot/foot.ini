[main]
font=JetBrainsMono Nerd Font:size=11
dpi-aware=yes
term=xterm-256color
shell=/usr/bin/zsh
app-id=foot
title=foot terminal
pad=8x8

[scrollback]
lines=10000

[csd]
preferred=none

[key-bindings]
clipboard-copy=Control+c
clipboard-paste=Control+v

[cursor]
blink=yes

[mouse]
hide-when-typing=yes

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3

[text-bindings]
\x03=Control+Shift+c
\x17=Control+BackSpace

[colors-dark]
foreground=e8d8ff
background=0a0a0f
cursor=aa00ff

selection-foreground=0a0a0f
selection-background=aa00ff

regular0=0a0a0f
regular1=ff00aa
regular2=00ff88
regular3=ffcc00
regular4=7700cc
regular5=aa00ff
regular6=00cccc
regular7=b09acc

bright0=6b4f9e
bright1=ff00aa
bright2=00ff88
bright3=ffcc00
bright4=aa00ff
bright5=aa00ff
bright6=00ffff
bright7=e8d8ff