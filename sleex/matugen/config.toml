[config]
version_check = false

[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/sleex/user/generated/colors.json'
# matugen's own templates table is a Rust HashMap, so without an explicit
# index its write order is randomized per run - this is the one file
# QuickShell's MaterialThemeLoader watches live for the whole bar/shell
# theme, so it has to go out before anything else every time
index = -10

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/sleex/custom/colors.lua'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland/hyprlock.conf'
output_path = '~/.config/hypr/hyprlock.conf'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel/fuzzel_theme.ini'
output_path = '~/.config/fuzzel/fuzzel_theme.ini'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk/gtk-colors.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk/gtk-colors.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/sleex/user/generated/wallpaper/path.txt'

# kde_colors, discord, vscode, zed and kitty templates were dropped here:
# - kde_colors wrote the same generated/color.txt that switchwall.sh's own
#   generate_colors_material.py --cache immediately overwrites right after,
#   so matugen's own computation and write for it was always thrown away
# - discord/vscode/zed/kitty theme apps not shipped in Kira's default stack,
#   and the kitty template's post_hook spawned a subprocess on every single
#   wallpaper/mode change regardless of whether kitty was even installed
# None of these were part of the live QuickShell theme path, so dropping
# them only cuts dead work off of every switchwall.sh run