general {
    lock_cmd = qs -p /usr/share/sleex ipc call lock lock
    before_sleep_cmd = qs -p /usr/share/sleex ipc call lock lock
    after_sleep_cmd = hyprctl dispatch dpms on  # avoids having to press a key twice to turn the display back on
}

listener {
    timeout = 120                             # 2min.
    on-timeout = brightnessctl -s set 10      # avoid 0 on OLED monitors
    on-resume = brightnessctl -r
}

# turn off keyboard backlight if present (auto-detect device)
listener {
    timeout = 300    # 5min.
    on-timeout = KBD=$(ls /sys/class/leds | grep -i kbd_backlight | head -n1) && \
                 [ -n "$KBD" ] && brightnessctl -sd "$KBD" set 0
    on-resume  = KBD=$(ls /sys/class/leds | grep -i kbd_backlight | head -n1) && \
                 [ -n "$KBD" ] && brightnessctl -rd "$KBD"
}

listener {
    timeout = 120                                             # 2min.
    on-timeout = qs -p /usr/share/sleex ipc call lock lock
}

listener {
    timeout = 600                      # 10min
    on-timeout = loginctl suspend
}
